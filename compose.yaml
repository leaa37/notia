# Notia como servidor sin ventana. Todo lo que guarda queda en ./data.
#
# Primera vez (pide la contraseña del servidor y termina):
#   docker compose run --rm notia --set-owner-password
# Después:
#   docker compose up -d
# y abrí https://<IP de este equipo>:52480/ (certificado autofirmado).
services:
  notia:
    build: .
    image: notia-headless
    ports:
      - "52480:52480"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
