[package]
name = "notia-backend-core"
version = "0.1.0"
description = "Tauri-independent backend core for Notia"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
regex = "1.10"
# Markdown exports: the note is parsed, laid out and written as PDF or DOCX.
pulldown-cmark = { version = "0.13", default-features = false }
pdf-writer = "0.12"
subsetter = { version = "0.2", default-features = false }
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }
miniz_oxide = "0.8"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
# Pictures of the diagrams the editor draws for a PDF export.
png = "0.18"
# AI actions: schedules in the library's IANA time zone (bundled tzdb on
# Windows, the system's on Android and Linux).
jiff = "0.2"
# Webhook: the tokens of its actions are stored as SHA-256.
sha2 = "0.10"

[dev-dependencies]
lopdf = "0.45"
quick-xml = "0.38"
